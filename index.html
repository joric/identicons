<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Joric's GitHub Identicons Generator and Finder</title>
<link rel="shortcut icon" type="image/x-icon" href="data:," />

<meta property="og:site_name" content="Joric" />
<meta property="og:type" content="object" />
<meta property="og:title" content="Joric's GitHub Identicons Generator and Finder" />
<meta property="og:description" content="Find GitHub username by image with this reverse-engineered identicon generator and lookup tool. Search, decode, and identify users by their unique 5x5 GitHub avatar patterns." />

<link href="css/bootstrap.min.css" rel="stylesheet"/>
<script src="js/bootstrap.bundle.min.js"></script>

<script src="js/jquery.min.js"></script>
<script src="js/popper.min.js"></script>

<body>

<nav class="navbar bg-body-tertiary">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center w-100">
      <a class="navbar-brand" href=".">Identicons Generator and Finder</a>
      
      <span id="link" class="text-center d-none d-lg-inline"><a href="https://github.com/joric">https://github.com/joric</a></span>
      
      <div class="d-flex align-items-center gap-2 me-5 me-md-0 me-lg-0">
        <label for="theme-switch">Dark Mode</label>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" id="theme-switch" type="checkbox" role="switch">
        </div>
      </div>
    </div>
  </div>
</nav>

<script>
  const tsw = document.querySelector('#theme-switch');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = localStorage.theme === 'dark' || (!localStorage.theme && systemDark);
  tsw.checked = isDark;
  document.documentElement.dataset.bsTheme = isDark ? 'dark' : 'light';
  tsw.onchange = _ => document.documentElement.dataset.bsTheme = localStorage.theme = tsw.checked ? 'dark' : 'light';
</script>

<main class="py-4">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-8">

<div class="row mb-3">


  <label class="col-sm-3 col-form-label fw-bold">Generate</label>

  <div class="col-sm-9">
    <div class="d-flex justify-content-between align-items-center gap-3">

      <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-primary" id="randomize">Random ID</button>
        <button class="btn btn-outline-primary" type="button" id="search" onclick="loadUserName()">Fetch Username</button>
        <button class="btn btn-outline-primary" type="button" id="search" onclick="search_image()">Search by Image</button>

      </div>


    <!--
      <div class="btn-group" role="group">
        <input type="radio" class="btn-check" name="mode" id="mode-login" checked="">
        <label class="btn btn-outline-primary" for="mode-login">Login</label>

        <input type="radio" class="btn-check" name="mode" id="mode-id">
        <label class="btn btn-outline-primary" for="mode-id">User ID</label>

        <input type="radio" class="btn-check" name="mode" id="hash-id">
        <label class="btn btn-outline-primary" for="hash-id">Hash</label>

        <input type="radio" class="btn-check" name="mode" id="color-id">
        <label class="btn btn-outline-primary" for="color-id">Color</label>

        <input type="radio" class="btn-check" name="mode" id="image-id">
        <label class="btn btn-outline-primary" for="image-id">Image</label>
      </div>
    -->

      <select id="select" class="form-select" style="width: auto; min-width: 120px;">
        <option></option>
        <option value="852547">joric</option>
        <option value="218503">stewartlord</option>
        <option value="6104">jasonlong</option>
        <option value="197742">infusion</option>
        <option value="1873201">ppuleo</option>
        <option value="54293946">wjhbr</option>
        <option value="260864">260864</option>
        <option value="852547">852547</option>
      </select>

    </div>
  </div>
</div>


<div class="row mb-3">
  <label for="login" class="col-sm-3 col-form-label fw-bold">Username</label>
  <div class="col-sm-9">
    <form id="nameForm">
    <div class="input-group">
      <input type="text" class="form-control" id="username" placeholder="Username" value="joric">
      <button class="btn" title="Fetch Login by ID" id="getName" style="border: 1px solid #ced4da; border-left: none; background: white; color: #6c757d;">⟳</button>
    </div>
    </form>
  </div>
</div>

<div class="row mb-3">
  <label for="userid" class="col-sm-3 col-form-label fw-bold">User ID</label>
  <div class="col-sm-9">
    <form id="idForm">
    <div class="input-group">
      <input type="number" class="form-control flex-grow-1" id="userid" placeholder="User ID" inputmode="numeric" pattern="[0-9]*" value="852547">
      <button class="btn" title="Fetch ID by Username" id="fetchBtn" style="border: 1px solid #ced4da; border-left: none; background: white; color: #6c757d;">⟳</button>
    </div>
    </form>
  </div>
</div>


<div class="row mb-3">
  <label for="md5" class="col-sm-3 col-form-label fw-bold">Hash</label>
  <div class="col-sm-9">
    <input type="text" class="form-control" id="hash" placeholder="Hash" readonly="" value="b174308173bc8ca5843c8d896a3dda07" disabled="">
  </div>
</div>

<div class="row mb-3">
  <label for="md5" class="col-sm-3 col-form-label fw-bold">Color</label>
  <div class="col-sm-9">
    <div class="btn-group" role="group">
      <input type="color" id="fgColor" value="#9FA9DD"  class="form-control form-control-color">
      <button class="btn" type="button" id="upload" onclick="upload_image()">Upload Image</button>
    </div>
  </div>
</div>

<div class="row mb-3">
  <label for="md5" class="col-sm-3 col-form-label fw-bold">Image</label>
  <div class="col-sm-9">
    <canvas id="canvas" width=420 height=420></canvas>
  </div>
</div>


</form>

</div>
</div>
</div>

</main>

</body>
